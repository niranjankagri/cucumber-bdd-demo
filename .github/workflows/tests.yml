# Runs the suite headless in Chrome on every push and pull request to main, and once a day: TC-101 uses
# a public practice site, so the daily run also shows when that site changed. TC-102 runs against
# Pattern Shop (my own demo shop), started from its published image next to the tests. The JUnit XML is kept
# as its own artifact for the CI results collection of automation-coverage-quality-intelligence.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '20 5 * * *'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Cucumber scenarios (Chrome headless, JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # A fresh shop for this job only (nothing shared, never down); the tests reach it on localhost:8080
      - name: Start Pattern Shop
        run: |
          docker run -d --name shop -p 8080:8080 ghcr.io/niranjankagri/pattern-shop-demo-app:latest
          for i in $(seq 1 30); do [ "$(curl -s localhost:8080/health)" = "ok" ] && exit 0; sleep 1; done
          docker logs shop; exit 1

      # Chrome is preinstalled on the runner; Selenium Manager fetches the matching driver
      - name: Run the tests
        run: mvn -B test -Dheadless=true

      - name: Keep the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: |
            target/cucumber-reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep the JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-tests
          path: target/surefire-reports/TEST-*.xml
          if-no-files-found: warn
          retention-days: 30
