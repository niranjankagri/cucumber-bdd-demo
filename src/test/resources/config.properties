# Test settings, read by com.niranjankagri.cucumberdemo.utils.Config.
# Any key can be overridden for one run: mvn test -D<key>=<value>, e.g. -Dbrowser=edge -Dheadless=true

# chrome, firefox or edge (Selenium Manager downloads the matching driver)
browser = chrome
# true = no browser window (CI); the window is then 1920x1080
headless = false
# Seconds to wait for the expected page text (Sauce Demo slow user)
waitSeconds = 10

# Practice site and the test user its login page publishes (not a secret)
practiceSiteUrl = https://the-internet.herokuapp.com/
practiceUser = tomsmith
practicePassword = SuperSecretPassword!

# Sauce Demo shop; its demo users are in Example.feature
sauceDemoUrl = https://www.saucedemo.com/
